site_name: rag-poison-lab
site_description: Plant text in a RAG corpus, hijack the agent. A pentest harness measuring how susceptible each model is to indirect prompt injection. 8 attack families, multi-model comparison, naive vs hardened.
site_url: https://loffah.github.io/rag-poison-lab/
repo_url: https://github.com/Loffah/rag-poison-lab
repo_name: Loffah/rag-poison-lab
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Backends: backends.md
  - Attack families: attack-families.md
  - Defenses (naive vs hardened): defenses.md
  - Scoring: scoring.md
  - Architecture: architecture.md
  - CLI reference: cli.md
  - Writing an attack: extending.md
  - Security & key handling: security.md
