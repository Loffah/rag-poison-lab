[project]
name = "rag-poison-lab"
version = "0.0.1"
description = "A pentest harness for RAG systems: probes for indirect prompt injection, exfiltration channels, and tool-call hijack against agentic-AI deployments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "loffah" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
rag-poison-lab = "rag_poison_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_poison_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
