[project]
name = "rag-poison-lab"
version = "0.0.1"
description = "Plant text in a RAG corpus, hijack the agent. A pentest harness measuring how susceptible each model is to indirect prompt injection: 8 attack families, multi-model comparison, naive vs hardened."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "loffah" }]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
rag-poison-lab = "rag_poison_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_poison_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
